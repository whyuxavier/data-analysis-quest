<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0a0a0a"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Місія «Аналітик даних»</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          darkBg: '#0a0a0a',
          darkCard: '#121212',
          darkBorder: '#262626',
        }
      }
    }
  }
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root{
  color-scheme: dark;
  --text: #e5e5e5;
  --bg: #0a0a0a;
  --line: #171717;
  --card: #121212;
  --field: #171717;
  --edge: #262626;
  --shadow: rgba(0, 0, 0, 0.5);
  --green: #22c55e;
  --soft: rgba(34, 197, 94, 0.08);
  --yellow: #ffd23f;
  --red: #f43f5e;
  --softred: rgba(244, 63, 94, 0.08);
  --blue: #38bdf8;
}

*{box-sizing:border-box}

body{
  margin: 0;
  font-family: 'Inter', system-ui, sans-serif;
  color: var(--text);
  background-color: var(--bg);
  background-image: none;
  min-height: 100vh;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

#app{max-width:760px;margin:0 auto;padding:24px 16px}

h1{font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.1;margin:.2em 0;font-weight:700;color:#ffffff;letter-spacing:-0.02em}
h2{font-size:1.3rem;margin:.2em 0 .8em;font-weight:600;color:#ffffff}

.card{
  color: var(--text);
  background: var(--card);
  border: 1px solid var(--edge);
  border-radius: 16px;
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
  padding: 24px;
  margin: 16px 0;
  backdrop-filter: blur(12px);
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom right, rgba(34, 197, 94, 0.03), transparent);
  pointer-events: none;
}

.tag{
  display: inline-block;
  background: rgba(34, 197, 94, 0.1);
  color: #4ade80;
  border: 1px solid rgba(34, 197, 94, 0.2);
  padding: 4px 12px;
  font-weight: 600;
  font-size: 0.8rem;
  border-radius: 8px;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

svg.circuit{background:none;border:0;color:#737373;max-width:520px;display:block;margin:16px 0}
.chip{fill:#171717}

input[type=text],input.num,select{
  font: inherit;
  color: var(--text);
  padding: 12px 16px;
  border: 1px solid var(--edge);
  background: var(--field);
  width: 100%;
  max-width: 360px;
  border-radius: 12px;
  transition: all 0.2s ease;
}
input[type=text]:focus, input.num:focus, select:focus {
  border-color: #22c55e;
  outline: none;
  box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
}
input.num{max-width:110px;text-align:center;font-weight:700}

.btn,.opt{
  font: inherit;
  cursor: pointer;
  border: 1px solid var(--edge);
  background: var(--field);
  padding: 12px 20px;
  text-align: left;
  color: var(--text);
  border-radius: 12px;
  transition: all 0.2s ease;
}

.btn{
  background: #22c55e;
  border-color: #22c55e;
  color: #052e16;
  font-weight: 700;
  text-align: center;
  box-shadow: 0 4px 14px rgba(34, 197, 94, 0.3);
  margin-top: 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.btn:hover {
  background: #16a34a;
  border-color: #16a34a;
  transform: translateY(-1px);
}
.btn.alt{
  background: var(--field);
  border-color: var(--edge);
  color: var(--text);
  box-shadow: none;
}
.btn.alt:hover {
  background: rgba(255, 255, 255, 0.05);
  border-color: #404040;
}
a.btn{display:inline-block;text-decoration:none}

table{border-collapse:collapse;margin:12px 0;width:100%;border-radius:12px;overflow:hidden;border:1px solid var(--edge)}
td,th{border:1px solid var(--edge);padding:10px 16px;text-align:center}
th{background:rgba(255,255,255,0.03);color:#ffffff;font-weight:600}

.btn:disabled{opacity:.5;cursor:default;transform:none!important;box-shadow:none!important}
.btn:active{transform:translateY(1px)}

.opts{display:grid;gap:12px;margin:16px 0}
.opt:hover:not(:disabled){background:rgba(255, 255, 255, 0.03);border-color: #404040;transform: translateY(-1px);}
.opt.good,select.good{background: rgba(34, 197, 94, 0.1) !important;border-color: #22c55e !important;color: #4ade80 !important}
.opt.bad,select.bad{background: rgba(244, 63, 94, 0.1) !important;border-color: #f43f5e !important;color: #fb7185 !important}
.opt:disabled{cursor:default;color:var(--text)}

:focus-visible{outline:2px solid var(--green);outline-offset:2px}

.q{font-size:1.15rem;font-weight:600;margin:.2em 0 1em;color:#ffffff;line-height:1.4}
.fb{margin-top:14px;padding:0;min-height:0;border-radius:12px}
.fb:not(:empty){padding:14px 16px;border-left:4px solid #22c55e;background: rgba(34, 197, 94, 0.08);color:#d4d4d4}
.fb.no{border-color:#f43f5e;background: rgba(244, 63, 94, 0.08)}

.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--edge)}
.row select{max-width:200px}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.chips b{border:1px solid #404040;color:#ffffff;min-width:46px;text-align:center;padding:10px;background:var(--field);font-size:1.2rem;border-radius:12px;font-family:monospace;box-shadow: inset 0 2px 4px rgba(0,0,0,0.3)}

.calc{display:flex;gap:16px;flex-wrap:wrap;margin:16px 0}.calc label{display:grid;gap:6px;font-weight:600;font-size:0.9rem;color:#a3a3a3}

#hud{
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(18, 18, 18, 0.85);
  backdrop-filter: blur(12px);
  border: 1px solid var(--edge);
  border-radius: 16px;
  color: var(--text);
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 20px;
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
}
#bar{height:8px;background:var(--edge);border-radius:4px;flex:1 1 100%;transition:background .3s ease}
.cnt{font-size:.9rem;color:#a3a3a3}.cnt b{color:#fff}.cnt .ok{color:#22c55e}.cnt .no{color:#f43f5e}
.info{width:22px;height:22px;border-radius:50%;border:1px solid var(--edge);background:transparent;color:#a3a3a3;font:italic 700 13px Georgia,serif;cursor:pointer;margin-left:10px;padding:0;line-height:1}
.info:hover,.info[aria-expanded=true]{color:#fff;border-color:#a3a3a3}
.infp{position:absolute;top:calc(100% + 8px);left:0;right:0;background:#121212;border:1px solid var(--edge);border-radius:14px;padding:14px 16px;font-size:.88rem;line-height:1.5;color:#d4d4d4;box-shadow:0 14px 30px rgba(0,0,0,.55)}
.infp[hidden]{display:none}
.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 10px;margin-top:10px}.gr span{color:#a3a3a3;white-space:nowrap}.gr b{color:#facc15;margin-right:4px}
.sheet{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #dadce0;margin:12px 0;color:#202124;font-family:Arial,Helvetica,sans-serif;font-size:.92rem}
.sheet table{margin:0;border:0;border-radius:0;width:100%}
.sheet th,.sheet td{border:1px solid #e3e5e8;padding:5px 12px;text-align:left;color:#202124;font-weight:400}
.sheet th{background:#f8f9fa;color:#5f6368;text-align:center;font-size:.8rem}
.sheet td.rn{background:#f8f9fa;color:#5f6368;text-align:center;width:38px;font-size:.8rem;padding:5px 4px}
.sheet td.hd{background:#f1f3f4;font-weight:700}
.sheet td.n{text-align:right}
#body svg{display:block;margin-bottom:18px}
.sheet{margin-bottom:20px}

.btn.hintbtn{margin:0 0 12px;padding:8px 14px;font-size:.88rem;color:#facc15;border-color:rgba(250,204,21,.35);background:rgba(250,204,21,.06);box-shadow:none}
.btn.hintbtn:hover{background:rgba(250,204,21,.12);border-color:#facc15}
.hintbox{margin:0 0 14px;padding:12px 14px;border-left:4px solid #facc15;background:rgba(250,204,21,.07);border-radius:10px;color:#e5e5e5;font-size:.95rem}

svg{width:100%;height:auto;color:var(--text);background:var(--field);border:1px solid var(--edge);border-radius:12px}
svg text:not([fill]){fill:currentColor}

.done{margin-top:16px;font-weight:600;color:#a3a3a3}

.grade{
  width: 140px;
  height: 140px;
  border: 2px solid rgba(34, 197, 94, 0.3);
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 3.5rem;
  font-weight: 800;
  background: rgba(34, 197, 94, 0.05);
  color: #4ade80;
  margin: 16px auto;
  box-shadow: 0 0 30px rgba(34, 197, 94, 0.15);
}
.grade small{font-size:0.9rem;display:block;text-align:center;margin-top:-16px;color:#a3a3a3;font-weight:500}

.tb{margin:16px 0}.tb .t{display:flex;justify-content:space-between;font-weight:600;font-size:0.95rem;margin-bottom:6px}
.tb .bg{height:10px;border:1px solid var(--edge);background:var(--field);border-radius:6px;overflow:hidden}
.tb .bg i{display:block;height:100%;background:#22c55e;border-radius:6px}
.tb .bg i.mid{background:#facc15}
.tb .bg i.low{background:#f43f5e}
.tb p{margin:.4em 0 0;font-size:.9rem;color:#a3a3a3}

.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}

@media print{
  :root{--text:#111;--bg:#fff;--line:#fff;--card:#fff;--field:#fff;--edge:#ddd;--shadow:none;--soft:#f0fdf4;--softred:#fef2f2;--green:#16a34a;--red:#dc2626}
  #hud,.btns{display:none}
  .card{box-shadow:none;border:1px solid #ddd}
  body{background:#fff;color:#111}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div id="app"></div>
<script>
const $=(s,e=document)=>e.querySelector(s);
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>String(Math.round(n*10)/10).replace('.',',');
const KEY='analiz-danykh-10-v1';
const fresh=()=>({i:0,res:[],tp:{},k:0,fin:false,end:false,hints:0,hu:{}});
const S=Object.assign({name:'',cls:''},fresh());
const app=$('#app');

/* ---------- універсальний квіз ---------- */
function quiz(qs,pre){return(el,done)=>{
  let k=Math.min(S.k||0,qs.length-1);
  const show=()=>{
    const q=qs[k];
    const ord=q.fix?q.o.map((_,i)=>i):sh(q.o.map((_,i)=>i));
    el.innerHTML=(q.pre?q.pre():pre?pre():'')+`<p class="q">${q.q}</p><div id="hz"></div><div class="opts">${ord.map(i=>`<button class="opt" data-i="${i}">${q.o[i]}</button>`).join('')}</div><div class="fb" id="fb"></div><div id="nx"></div>`;
    hintUI(el,`${S.i}:${k}`,q.h);
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const ok=+b.dataset.i===q.a;
      el.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.i===q.a)x.classList.add('good')});
      if(!ok)b.classList.add('bad');
      hintOff(el);rec(ok);S.k=k+1;save();
      const fb=$('#fb',el);fb.className='fb'+(ok?'':' no');
      fb.textContent=(ok?'Вірно! ':'Не зовсім. ')+q.e;
      if(k<qs.length-1){$('#nx',el).innerHTML='<button class="btn alt" id="n">Наступне питання</button>';$('#n',el).onclick=()=>{k++;show()}}
      else done();
    });
  };show();
}}

/* ---------- обчислення: середнє, медіана, мода ---------- */
function calcTask(el,done){
  let d,mode;
  for(;;){
    d=Array.from({length:7},()=>1+Math.floor(Math.random()*9));
    const c={};d.forEach(x=>c[x]=(c[x]||0)+1);
    const m=Math.max(...Object.values(c)),ms=Object.keys(c).filter(x=>c[x]===m);
    if(ms.length===1&&m>=2){mode=+ms[0];break}
  }
  const sum=d.reduce((a,b)=>a+b,0),mean=sum/7,med=[...d].sort((a,b)=>a-b)[3];
  el.innerHTML=`<p class="q">Ось оцінки з міні-опитування. Знайди три показники.</p><div id="hz"></div><div class="chips">${d.map(x=>`<b>${x}</b>`).join('')}</div>
  <div class="calc"><label>Середнє (до десятих)<input class="num" id="c1" inputmode="decimal"></label><label>Медіана<input class="num" id="c2" inputmode="decimal"></label><label>Мода<input class="num" id="c3" inputmode="decimal"></label></div>
  <button class="btn" id="chk">Перевірити</button><div class="fb" id="fb"></div>`;
  hintUI(el,`${S.i}`,'Спершу впорядкуй вибірку за зростанням. Медіана — число посередині впорядкованого ряду (з 7 чисел це четверте). Мода — число, яке трапляється найчастіше. Середнє — сума всіх чисел, поділена на 7.');
  $('#chk').onclick=()=>{
    const v=i=>parseFloat(($('#c'+i).value||'').replace(',','.'));
    const r=[Math.abs(v(1)-mean)<=0.1,v(2)===med,v(3)===mode];
    r.forEach((ok,i)=>$('#c'+(i+1)).style.background=ok?'rgba(34, 197, 94, 0.1)':'rgba(244, 63, 94, 0.1)');
    const p=r.filter(Boolean).length;
    $('#chk').disabled=true;
    const fb=$('#fb');fb.className='fb'+(p===3?'':' no');
    fb.innerHTML=`Середнє: ${sum} ÷ 7 ≈ ${fmt(mean)}.<br>Медіана: у впорядкованому ряду посередині стоїть ${med}.<br>Мода: найчастіше трапляється ${mode}.`;
    hintOff(el);r.forEach(ok=>rec(ok));done();
  };
}

/* ---------- функції Google Таблиць ---------- */
function matchTask(el,done){
  const rows=[['Середнє арифметичне діапазону','AVERAGE'],['Значення посередині впорядкованого ряду','MEDIAN'],['Найчастіше значення','MODE'],['Сума всіх чисел','SUM'],['Найбільше число','MAX']];
  const fn=['AVERAGE','MEDIAN','MODE','SUM','MAX','MIN','COUNT'];
  el.innerHTML=`<p class="q">Підбери функцію Google Таблиць до кожної задачі.</p><div id="hz"></div>`+rows.map((r,i)=>`<div class="row"><span style="color:#e5e5e5">${r[0]}</span><select id="s${i}"><option value="">Обери…</option>${sh(fn).map(f=>`<option>${f}</option>`).join('')}</select></div>`).join('')+`<button class="btn" id="chk">Перевірити</button><div class="fb" id="fb"></div>`;
  hintUI(el,`${S.i}`,'Англійські назви схожі на українські терміни: AVERAGE — середнє, MEDIAN — медіана, MODE — мода. SUM додає числа, а MAX шукає найбільше.');
  $('#chk').onclick=()=>{
    hintOff(el);let p=0;const wrong=[];
    rows.forEach((r,i)=>{const s=$('#s'+i),ok=s.value===r[1];rec(ok);if(ok)p++;else wrong.push(`${r[0]}: ${r[1]}`);s.className=ok?'good':'bad';s.disabled=true});
    $('#chk').disabled=true;
    const fb=$('#fb');fb.className='fb'+(p===5?'':' no');
    fb.innerHTML=p===5?'Усі функції підібрано правильно!':'Правильні відповіді:<br>'+wrong.join('<br>');
    done();
  };
}

/* ---------- порядок етапів ---------- */
function orderTask(el,done){
  const st=['Сформулювати питання','Зібрати дані','Очистити й упорядкувати дані','Порахувати й побудувати діаграми','Зробити висновки та поділитися ними'];
  const pool=sh(st);let pick=[],locked=false;
  const draw=()=>{
    el.innerHTML=`<p class="q">Розстав етапи аналізу даних у правильному порядку: натискай по черзі.</p><div id="hz"></div>
    <ol style="margin: 0 0 16px 20px; color: #a3a3a3;">${pick.map(x=>`<li style="margin-bottom:6px; color: #ffffff; font-weight:500;">${x}</li>`).join('')}</ol>
    <div class="opts">${pool.filter(x=>!pick.includes(x)).map(x=>`<button class="opt" data-t="${x}">${x}</button>`).join('')}</div>
    <div class="btns">${pick.length&&!locked?'<button class="btn alt" id="rs">Почати спочатку</button>':''}${pick.length===5&&!locked?'<button class="btn" id="ok">Перевірити</button>':''}</div><div class="fb" id="fb"></div>`;
    if(!locked||S.hu[`${S.i}`])hintUI(el,`${S.i}`,'Подумай, що аналітик робить найпершим: з’ясовує, навіщо йому дані. А останнім він розповідає іншим про результат.');
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{pick.push(b.dataset.t);draw()});
    if($('#rs'))$('#rs').onclick=()=>{pick=[];draw()};
    if($('#ok'))$('#ok').onclick=()=>{
      locked=true;const c=pick.filter((x,i)=>x===st[i]).length,p=c===5?1:0;
      draw();const fb=$('#fb');fb.className='fb'+(p===1?'':' no');
      fb.innerHTML='Правильний порядок:<br>'+st.map((x,i)=>`${i+1}. ${x}`).join('<br>');
      rec(p===1);done();
    };
  };draw();
}

/* ---------- графіки ---------- */
function smooth(p,lo,hi){const cl=v=>Math.min(hi,Math.max(lo,v));let d=`M${p[0][0].toFixed(1)} ${p[0][1].toFixed(1)}`;for(let i=0;i<p.length-1;i++){const a=p[i-1]||p[i],b=p[i],c=p[i+1],e=p[i+2]||c;d+=`C${(b[0]+(c[0]-a[0])/6).toFixed(1)} ${cl(b[1]+(c[1]-a[1])/6).toFixed(1)} ${(c[0]-(e[0]-b[0])/6).toFixed(1)} ${cl(c[1]-(e[1]-b[1])/6).toFixed(1)} ${c[0].toFixed(1)} ${c[1].toFixed(1)}`}return d}
function lineChart(title,series){
  const m=['січ','лют','бер','кві','тра','чер','лип','сер','вер','жов','лис','гру'],X0=46,X1=406,Y0=84,Y1=196,W=(X1-X0)/12;
  const yv=v=>Y1-v/100*(Y1-Y0);
  const grid=[0,25,50,75,100].map(v=>`<line x1="${X0}" x2="${X1}" y1="${yv(v)}" y2="${yv(v)}" stroke="${v?'#e3e5e8':'#9aa0a6'}"/><text x="${X0-8}" y="${yv(v)+3.5}" font-size="10" text-anchor="end" fill="#5f6368">${v}</text>`).join('');
  const lines=series.map(o=>`<path d="${smooth(o.v.map((v,i)=>[X0+(i+.5)*W,yv(v)]),Y0,Y1)}" fill="none" stroke="${o.c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`).join('');
  const lg=series.map((o,i)=>`<g transform="translate(${16+i*84} 52)"><rect width="76" height="20" rx="10" fill="#fff" stroke="#dadce0"/><circle cx="12" cy="10" r="4.5" fill="${o.c}"/><text x="22" y="14" font-size="10.5" fill="#202124">${o.n}</text></g>`).join('');
  return `<svg viewBox="0 0 420 224" role="img" aria-label="${title}"><rect width="420" height="224" rx="11" fill="#fff"/><text x="16" y="24" font-size="13" font-weight="600" fill="#202124">Інтерес у часі</text><text x="16" y="40" font-size="10" fill="#5f6368">${title}</text>${lg}${grid}${lines}${m.map((t,i)=>`<text x="${X0+(i+.5)*W}" y="212" font-size="9.5" text-anchor="middle" fill="#5f6368">${t}</text>`).join('')}</svg>`;
}
const SKI=[85,100,60,30,15,10,8,10,20,35,55,90],BEACH=[10,10,15,30,55,80,100,90,50,25,12,10];
const chart=()=>lineChart('Google Trends · Україна · останні 12 місяців',[{v:SKI,c:'#4285f4',n:'лижі'}]);
const chart2=()=>lineChart('Google Trends · Україна · останні 12 місяців',[{v:SKI,c:'#4285f4',n:'лижі'},{v:BEACH,c:'#ea4335',n:'пляж'}]);

const bars=()=>{
  const X0=56,X1=356,Y0=66,Y1=190,u=(Y1-Y0)/5,yv=v=>Y1-(v-50)*u;

/* ---------- розмах і частота ---------- */
function rangeTask(el,done){
  const d=Array.from({length:8},()=>3+Math.floor(Math.random()*10));
  const x=d[Math.floor(Math.random()*8)],rg=Math.max(...d)-Math.min(...d),fr=d.filter(v=>v===x).length;
  el.innerHTML=`<p class="q">Ряд даних: скільки годин на тиждень вісім учнів проводять за комп’ютером.</p><div id="hz"></div><div class="chips">${d.map(v=>`<b>${v}</b>`).join('')}</div>
  <div class="calc"><label>Розмах<input class="num" id="c1" inputmode="numeric"></label><label>Скільки разів трапляється ${x}?<input class="num" id="c2" inputmode="numeric"></label></div>
  <button class="btn" id="chk">Перевірити</button><div class="fb" id="fb"></div>`;
  hintUI(el,`${S.i}`,'Розмах = найбільше значення − найменше. Частота — скільки разів число трапляється в ряду: порахуй його серед усіх чисел.');
  $('#chk').onclick=()=>{
    const v=i=>parseFloat(($('#c'+i).value||'').replace(',','.'));
    const r=[v(1)===rg,v(2)===fr];
    r.forEach((ok,i)=>$('#c'+(i+1)).style.background=ok?'rgba(34, 197, 94, 0.1)':'rgba(244, 63, 94, 0.1)');
    const p=r.filter(Boolean).length;$('#chk').disabled=true;
    const fb=$('#fb');fb.className='fb'+(p===2?'':' no');
    fb.innerHTML=`Розмах: ${Math.max(...d)} − ${Math.min(...d)} = ${rg}.<br>Число ${x} трапляється ${fr} р.`;
    hintOff(el);r.forEach(ok=>rec(ok));done();
  };
}

const cor=()=>S.res.reduce((a,b)=>a+b,0);
const net=()=>Math.max(0,cor()-S.hints);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const load=()=>{try{const o=JSON.parse(localStorage.getItem(KEY)||'null');return o&&o.name&&Array.isArray(o.res)&&typeof o.i==='number'?o:null}catch(e){return null}};
const wipe=()=>{try{localStorage.removeItem(KEY)}catch(e){}};
const mix=(a,b,t)=>{const h=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16)),A=h(a),B=h(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};
function barBg(){const w=100/MAX,st=[];let run=0;for(let i=0;i<MAX;i++){const r=S.res[i];let c;if(r===1){run=0;c='#22c55e'}else if(r===0){run++;c=mix('#f59e0b','#ef4444',Math.min(1,(run-1)/3))}else c='#262626';st.push(c+' '+((i+.2)*w).toFixed(2)+'%',c+' '+((i+.8)*w).toFixed(2)+'%')}return 'linear-gradient(90deg,'+st.join(',')+')'}
function cnt(){const c=cor();return `Бали <b>${net()}</b> з ${MAX} · <b class="ok">✓ ${c}</b> · <b class="no">✗ ${S.res.length-c}</b>${S.hints?` · 💡 −${S.hints}`:''}`}
function hudUpdate(){const a=$('#cnt'),b=$('#bar');if(a)a.innerHTML=cnt();if(b)b.style.background=barBg()}
function rec(ok){const t=T[S.i],o=S.tp[t.topic]||(S.tp[t.topic]={p:0,m:0,h:0});o.m++;if(ok)o.p++;S.res.push(ok?1:0);save();hudUpdate()}
function hintUI(el,key,text){
  const z=$('#hz',el);if(!z||!text)return;
  const show=()=>{z.innerHTML=`<div class="hintbox">💡 ${text}</div>`};
  if(S.hu[key]){show();return}
  z.innerHTML='<button class="btn alt hintbtn" id="hb">💡 Підказка за 1 бал</button><div class="fb no" id="hm" hidden></div>';
  $('#hb',el).onclick=()=>{
    if(net()<1){const m=$('#hm',el);m.hidden=false;m.textContent='Підказка коштує 1 бал. Спершу дай правильну відповідь на якесь питання, щоб заробити бал.';return}
    const o=S.tp[T[S.i].topic]||(S.tp[T[S.i].topic]={p:0,m:0,h:0});
    o.h=(o.h||0)+1;S.hints++;S.hu[key]=1;save();hudUpdate();show();
  };
}
function hintOff(el){if($('#hb',el))$('#hz',el).innerHTML=''}
const TIPS={'Поняття':'Повтори, чим відрізняються дані, інформація й висновок.','Штучний інтелект':'Повтори, як формулювати запити до ШІ, чому його відповіді треба перевіряти і чому не можна передавати персональні дані.','Підготовка даних':'Повтори типи даних, очищення (дублікати, пропуски) та що таке репрезентативна вибірка.','Статистика':'Потренуй середнє, медіану, моду, розмах і частоту на власних наборах чисел, а також розглянь викиди.','Google Таблиці':'Попрацюй у Google Таблицях: AVERAGE, MEDIAN, MODE, COUNTIF, IF, фільтри, зведені таблиці.','Візуалізація':'Повтори, яку діаграму для чого обирати, що таке лінія тренду і як не спотворювати дані.','Google Trends':'Відкрий Google Trends, порівняй два запити й подивись, що означають значення 0–100 та сезонність.','Критичне мислення':'Повтори етапи аналізу даних і різницю між кореляцією та причиною.'};

/* ---------- екрани ---------- */
function infoHTML(){const rows=[];for(let g=12;g>=1;g--){const lo=g===1?0:Math.ceil((g-.5)/12*MAX-1e-9),hi=g===12?MAX:Math.ceil((g+.5)/12*MAX-1e-9)-1;rows.push(`<span><b>${g}</b>${lo===hi?lo:lo+'–'+hi}</span>`)}return `<b style="color:#fff">Як бали стають оцінкою</b><br>Бали = правильні відповіді − підказки (кожна −1).<br>Оцінка = бали ÷ ${MAX} × 12, округлюємо до цілого.<div class="gr">${rows.join('')}</div>`}
function hud(bar=true){return `<div id="hud"><span style="display:flex;align-items:center;"><span style="font-weight:600; color:#ffffff;">${S.name}, ${S.cls}</span><button class="info" id="inf" aria-label="Як бали переводяться в оцінку" aria-expanded="false">i</button></span><span id="cnt" class="cnt">${cnt()}</span>${bar?`<div id="bar" style="background:${barBg()}"></div>`:''}<div class="infp" id="infp" hidden>${infoHTML()}</div></div>`}
document.addEventListener('click',e=>{const p=$('#infp');if(!p)return;const b=e.target.closest('#inf');if(b){p.hidden=!p.hidden;b.setAttribute('aria-expanded',String(!p.hidden))}else if(!e.target.closest('#infp')){p.hidden=true;const i=$('#inf');if(i)i.setAttribute('aria-expanded','false')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const p=$('#infp');if(p)p.hidden=true}});
function form(){
  app.innerHTML=`<section class="card"><span class="tag">Місія "Аналітик даних"</span>
  <svg class="circuit" viewBox="0 0 600 150" role="img" aria-label="Схема мікросхеми з лініями даних"><g fill="none" stroke="currentColor" stroke-width="2"><path d="M0 45H70V30H150V50H230"/><path d="M0 75H230"/><path d="M0 105H50V125H140V100H230"/><path d="M370 45H450V25H530V45H600"/><path d="M370 75H480V95H560V75H600"/><path d="M370 105H420V125H510V105H600"/><path d="M260 10V20M290 10V20M320 10V20M350 10V20M260 130V140M290 130V140M320 130V140M350 130V140"/><rect x="230" y="20" width="140" height="110" class="chip"/><path d="M255 110H345"/></g><rect x="262" y="85" width="14" height="25" fill="#22c55e"/><rect x="286" y="62" width="14" height="48" fill="#ffd23f" stroke="currentColor" stroke-width="2"/><rect x="310" y="75" width="14" height="35" fill="#22c55e"/><rect x="334" y="50" width="14" height="60" fill="#ffd23f" stroke="currentColor" stroke-width="2"/><circle cx="246" cy="36" r="3.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2"><circle cx="150" cy="30" r="5" fill="#ffd23f"/><circle cx="140" cy="125" r="5" fill="#22c55e"/><circle cx="530" cy="25" r="5" fill="#22c55e"/><circle cx="510" cy="125" r="5" fill="#ffd23f"/><circle cx="480" cy="75" r="5" fill="#ffd23f"/><circle cx="560" cy="95" r="5" fill="#22c55e"/></g></svg>
  <p style="color: #a3a3a3; margin-bottom: 20px;"><b style="color:#fff">Тема: аналіз даних.</b> Перевір себе: ШІ, Google Таблиці, середнє, медіана, мода, Google Trends і діаграми. ${T.length} завдань, ${MAX} питань. Підказка 💡 коштує 1 бал, а прогрес зберігається автоматично.</p>
  <div style="display: grid; gap: 16px; max-width: 360px;">
    <div>
      <label for="nm" style="display:block; font-size:0.9rem; font-weight:600; margin-bottom:6px; color:#a3a3a3;">Твоє ім’я та прізвище</label>
      <input type="text" id="nm" autocomplete="off" placeholder="Наприклад, Олександра Екстер">
    </div>
    <div>
      <label for="cl" style="display:block; font-size:0.9rem; font-weight:600; margin-bottom:6px; color:#a3a3a3;">Клас</label>
      <input type="text" id="cl" autocomplete="off" placeholder="Наприклад, 10-А">
    </div>
  </div>
  <div class="fb no" id="er" hidden style="margin-top:16px;"></div>
  <br><button class="btn" id="go">Почати місію</button></section>`;
  $('#go').onclick=()=>{const n=$('#nm').value.trim(),c=$('#cl').value.trim();if(!n||!c){const e=$('#er');e.hidden=false;e.textContent='Вкажи ім’я, прізвище й клас, наприклад 10-А, щоб учитель знав, чий це результат.';return}Object.assign(S,fresh(),{name:n.replace(/[<>&"]/g,''),cls:c.replace(/[<>&"]/g,'')});save();task()};
  $('#nm').onkeydown=$('#cl').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
}
function task(){
  const t=T[S.i];
  app.innerHTML=hud()+`<section class="card"><span class="tag">${t.lvl}: ${t.topic}</span><h2>${t.title}</h2><div id="body"></div><div id="nav"></div></section>`;
  t.run($('#body'),done);
  window.scrollTo(0,0);
}
function done(){
  const t=T[S.i],c=S.res.slice(OFF[S.i],OFF[S.i]+t.max).reduce((a,b)=>a+b,0);
  S.fin=true;save();
  const last=S.i===T.length-1;
  $('#nav').innerHTML=`<p class="done">Правильно в цьому завданні: ${c} з ${t.max} ${pl(t.max)}</p><button class="btn" id="nxt">${last?'Побачити звіт':'Далі'}</button>`;
  $('#nxt').onclick=advance;
  $('#nxt').focus();
}
function advance(){
  const last=S.i===T.length-1;
  S.fin=false;S.k=0;
  if(last){S.end=true;save();report()}else{S.i++;save();task()}
}
function start(){
  const sv=load();
  if(!sv||sv.i>=T.length||sv.res.length>MAX){wipe();form();return}
  Object.assign(S,fresh(),sv);
  app.innerHTML=`<section class="card"><span class="tag">Збережений прогрес</span><h1>З поверненням, ${S.name}!</h1><p style="color:#a3a3a3;margin:8px 0 20px;">Клас: ${S.cls}. ${S.end?'Місію завершено, можна переглянути звіт.':`Відповіді: ${S.res.length} з ${MAX} ${pl(MAX)}, завдання ${Math.min(S.i+(S.fin?2:1),T.length)} з ${T.length}.`}</p><div class="btns" style="margin-top:0"><button class="btn" id="rs">${S.end?'Показати звіт':'Продовжити'}</button><button class="btn alt" id="nw">Почати заново</button></div></section>`;
  $('#rs').onclick=()=>{if(S.end)report();else if(S.fin)advance();else task()};
  let armed=false;
  $('#nw').onclick=()=>{
    if(!armed){armed=true;$('#nw').textContent='Так, видалити прогрес';return}
    wipe();Object.assign(S,{name:'',cls:''},fresh());form();
  };
}
function report(){
  const g=Math.max(1,Math.min(12,Math.round(net()/MAX*12)));
  const rank=g>=10?'Експерт даних':g>=7?'Аналітик':g>=4?'Стажер-аналітик':'Початківець';
  const ks=Object.keys(S.tp);
  const rows=ks.map(k=>{const o=S.tp[k],nt=Math.max(0,o.p-(o.h||0)),pc=Math.round(nt/o.m*100),cl=pc>=80?'':pc>=50?'mid':'low',st=pc>=80?'Опановано':pc>=50?'Майже опановано':'Потребує повторення';
    return `<div class="tb"><div class="t"><span>${k}</span><span>${o.p} з ${o.m}${o.h?` (підказок: ${o.h})`:''}, ${pc}%</span></div><div class="bg"><i class="${cl}" style="width:${pc}%"></i></div><p>${st}.${pc<80?' '+TIPS[k]:''}</p></div>`}).join('');
  const weak=ks.filter(k=>(S.tp[k].p-(S.tp[k].h||0))/S.tp[k].m<0.8);
  const sum=weak.length?`Для підвищення результату повтори: ${weak.join(', ')}.`:'Тему засвоєно на високому рівні. Так тримати!';
  app.innerHTML=hud(false)+`<section class="card"><span class="tag">Звіт про засвоєння теми</span><h1>${S.name}</h1><p style="color:#a3a3a3;margin-bottom:12px;"><b>Клас: ${S.cls}</b></p>
  <div class="grade">${g}<small>з 12</small></div>
  <p style="text-align:center; color:#a3a3a3; margin-bottom:20px;"><b>Рівень: ${rank}.</b> Правильно: ${cor()} з ${MAX} ${pl(MAX)}${S.hints?`; підказок використано: ${S.hints} (−${S.hints} бал.)`:''}. Підсумок: ${net()} з ${MAX} (${Math.round(net()/MAX*100)}%). Дата: ${new Date().toLocaleDateString('uk-UA')}.</p>
  ${rows}<p style="margin-top:20px; font-weight:600; color:#ffffff;"><b>${sum}</b></p>
  <div class="btns"><button class="btn alt" id="pr">Друкувати / зберегти PDF</button><button class="btn alt" id="cp">Скопіювати результат</button><button class="btn alt" id="rp">Пройти ще раз</button></div><div class="fb" id="fb"></div></section>`;
  $('#pr').onclick=()=>window.print();
  $('#rp').onclick=()=>{wipe();Object.assign(S,{name:'',cls:''},fresh());form()};
  $('#cp').onclick=()=>{
    const tx=`${S.name} (${S.cls}): оцінка ${g}/12 (правильно ${cor()} з ${MAX} питань, підказок: ${S.hints}). `+ks.map(k=>`${k} ${S.tp[k].p}/${S.tp[k].m}`).join('; ');
    const ok=()=>{$('#fb').textContent='Результат скопійовано. Надішли його вчителю.'};
    try{navigator.clipboard.writeText(tx).then(ok,()=>{$('#fb').textContent=tx})}catch(e){$('#fb').textContent=tx}
  };
  window.scrollTo(0,0);
}
start();
</script>
</body>
</html>
