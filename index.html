<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 Inter,system-ui,-apple-system,Segoe UI,sans-serif}

.q{font-size:1.12rem;font-weight:750;color:#fff;line-height:1.4;margin:18px 0 12px}.opts{display:grid;gap:9px;margin:14px 0}.opt{width:100%;text-align:left;border:1px solid var(--edge);border-radius:11px;background:var(--field);color:var(--text);padding:12px 14px;font:inherit;cursor:pointer}.opt:hover:not(:disabled){border-color:#666;background:#202020}.opt.correct{border-color:var(--green);background:#12301d;color:#bbf7d0}.opt.wrong{border-color:var(--red);background:#35151d;color:#fecdd3}.opt:disabled{cursor:default}.feedback{padding:13px 15px;border-radius:10px;margin-top:14px;background:#12301d;border-left:4px solid var(--green)}.feedback.bad{background:#35151d;border-color:var(--red)}.hint{margin:12px 0;padding:12px 14px;border-left:4px solid var(--yellow);background:#facc1510;border-radius:8px}.hidden{display:none!important}.data-table{width:100%;border-collapse:collapse;margin:12px 0}.data-table th,.data-table td{border:1px solid var(--edge);padding:9px 12px;text-align:left}.data-table th{background:#202020;color:#fff}.data-table td:last-child,.data-table th:last-child{text-align:right}.chip{display:inline-block;padding:8px 11px;background:#202020;border:1px solid var(--edge);border-radius:8px;margin:4px;font-weight:750}.codeword{display:inline-grid;place-items:center;min-width:40px;height:44px;padding:0 8px;border:1px solid #3f3f46;border-radius:9px;background:#202020;color:var(--yellow);font-weight:850;font-size:1.1rem;margin:3px}.mission-banner{border:1px dashed #3f3f46;border-radius:12px;padding:14px;background:#ffffff03;margin:16px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.result-score{font-size:4rem;font-weight:850;line-height:1;color:#4ade80;text-align:center;margin:20px 0 8px}.result-score small{font-size:1rem;color:var(--muted);font-weight:600}.topic-row{padding:12px 0;border-bottom:1px solid var(--edge)}.topic-row:last-child{border-bottom:0}.bar{height:8px;background:#2b2b2b;border-radius:6px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--green)}footer{text-align:center;color:#737373;font-size:.8rem;margin-top:24px}

</style>

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shell(content){$('#app').innerHTML=content}
function home(){const old=load();shell(`<section class="card hero"><span class="tag">Інтерактивний навчальний квест</span><div class="hero-art" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div><h1>Місія<br>«Аналітик даних»</h1><p class="muted">Допоможи шкільній команді обрати формат заходу. Пройди 6 рівнів і 30 запитань, збери шість ключових слів та склади фінальний алгоритм аналітика.</p><div class="grid"><div class="stat"><b>6 рівнів</b><span class="muted">від мети до рішення</span></div><div class="stat"><b>30 запитань</b><span class="muted">по 5 на рівень</span></div><div class="stat"><b>80% правильних</b><span class="muted">потрібно для ключа</span></div></div><div class="mission-banner"><b>Правило місії:</b> щоб отримати ключ рівня, потрібно правильно відповісти щонайменше на 4 із 5 запитань. Якщо результат нижчий за 80%, ключ не видається. Наприкінці заповни пропуски у фінальному реченні.</div><label for="nm">Ім’я та прізвище</label><input id="nm" placeholder="Наприклад, Олена Коваль" autocomplete="name"><label for="cl">Клас</label><input id="cl" placeholder="Наприклад, 10-А"><div id="err" class="feedback bad hidden"></div><div class="actions"><button class="btn" id="start">Почати місію</button>${old&&old.started?'<button class="btn secondary" id="resume">Продовжити збережений прогрес</button>':''}</div></section>`);$('#start').onclick=()=>{const n=$('#nm').value.trim(),c=$('#cl').value.trim();if(!n||!c){$('#err').textContent='Заповни ім’я та клас, щоб почати.';$('#err').classList.remove('hidden');return}state={name:n,cls:c,stage:0,answers:[],scores:[],clues:[],hintUsed:[],started:true,finished:false,finalInputs:{}};save();renderStage()};if($('#resume'))$('#resume').onclick=()=>{state=old;renderStage()}}
function topbar(){const complete=state.scores.filter(x=>x!==undefined).length;return `<div class="progress-top"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><b>${esc(state.name)} · ${esc(state.cls)}</b><span class="muted">${state.stage<stages.length?'Рівень '+(state.stage+1)+' з 6':'Фінальне завдання'}</span></div><div class="progress-line"><i style="width:${complete/6*100}%"></i></div><div class="muted" style="font-size:.82rem;margin-top:6px">Завершено рівнів: ${complete} із 6</div></div>`}
function stageNav(){return `<div class="stage-list">${stages.map((s,i)=>{const done=state.scores[i]!==undefined,active=i===state.stage;return `<div class="stage ${done?'done':''} ${active?'active':''}"><div class="num">${done?(state.clues[i]?'✓':'×'):i+1}</div><div><b>${s.name}</b><small>${s.short}</small></div><span class="status">${done?(state.clues[i]?'Ключ отримано':'Ключ не отримано'):active?'Поточний':'Попереду'}</span></div>`}).join('')}</div>`}
function renderStage(){if(state.stage>=stages.length){finalTask();return}const s=stages[state.stage];if(!state.answers[state.stage])state.answers[state.stage]=Array(5).fill(null);const answers=state.answers[state.stage];const finished=answers.every(x=>x!==null);shell(topbar()+`<section class="card"><span class="tag">${s.name}</span><h2 style="margin-top:14px">${s.title}</h2><p class="muted">${s.story}</p>${s.table?`<table class="data-table"><thead><tr><th>Варіант заходу</th><th>Кількість голосів</th></tr></thead><tbody>${s.table.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table>`:''}<div class="mission-banner"><b>Умова отримання ключа</b><p style="margin:5px 0 0">Дай щонайменше 4 правильні відповіді з 5 (80%). Ключ відкриється лише після завершення всіх запитань рівня.</p></div><div id="questions">${s.questions.map((q,qi)=>`<div class="topic-row"><p class="q">${qi+1}. ${q.q}</p><div class="opts">${q.options.map((o,oi)=>`<button class="opt ${answers[qi]!==null?(oi===q.a?'correct':oi===answers[qi]?'wrong':''):''}" data-q="${qi}" data-i="${oi}" ${answers[qi]!==null?'disabled':''}>${o}</button>`).join('')}</div><div class="feedback ${answers[qi]===null?'hidden':answers[qi]===q.a?'':'bad'}" id="fb${qi}" ${answers[qi]===null?'':'style="display:block"'}>${answers[qi]===null?'':esc(q.explain)}</div></div>`).join('')}</div><div class="actions"><button class="btn secondary" id="hintBtn">Підказка</button><button class="btn hidden" id="finishLevel">Перевірити рівень</button><button class="btn secondary" id="mapBtn">Карта квесту</button></div><div id="hint" class="hint hidden">${esc(s.questions[0].explain)}</div><div id="levelResult"></div></section><section class="card"><h3>Зібрані ключі</h3><p class="muted">Ключ видається лише за результату 80% або більше.</p><div>${stages.map((x,i)=>`<span class="codeword">${state.clues[i]?esc(state.clues[i].toUpperCase()):'?'}</span>`).join('')}</div></section><div id="navMap" class="card hidden"><h3>Карта квесту</h3>${stageNav()}</div>`);$('#questions').querySelectorAll('.opt:not(:disabled)').forEach(b=>b.onclick=()=>answer(+b.dataset.q,+b.dataset.i));$('#hintBtn').onclick=()=>{const h=$('#hint');h.classList.toggle('hidden');if(!state.hintUsed.includes(state.stage)){state.hintUsed.push(state.stage);save()}};$('#mapBtn').onclick=()=>$('#navMap').classList.toggle('hidden');if(finished)showLevelResult();}
function answer(qi,oi){const s=stages[state.stage],q=s.questions[qi],answers=state.answers[state.stage];answers[qi]=oi;const buttons=[...$('#questions').querySelectorAll(`[data-q="${qi}"]`)];buttons.forEach(b=>{b.disabled=true;const i=+b.dataset.i;if(i===q.a)b.classList.add('correct');else if(i===oi)b.classList.add('wrong')});const fb=$('#fb'+qi);fb.className='feedback'+(oi===q.a?'':' bad');fb.textContent=(oi===q.a?'Правильно. ':'Не зовсім. ')+q.explain;save();if(answers.every(x=>x!==null))showLevelResult()}
function showLevelResult(){const s=stages[state.stage],answers=state.answers[state.stage],score=answers.filter((x,i)=>x===s.questions[i].a).length;state.scores[state.stage]=score;const passed=score>=4;state.clues[state.stage]=passed?s.word:'';save();const box=$('#levelResult');box.innerHTML=`<div class="feedback ${passed?'':'bad'}"><b>${passed?'Рівень пройдено — ключ отримано!':'Поріг 80% не досягнуто — ключ не отримано.'}</b><p style="margin:7px 0">Результат: ${score} з 5 (${score*20}%). ${passed?'Твоє ключове слово:':'Потрібно було правильно відповісти щонайменше на 4 запитання. Ключове слово'} <span class="codeword">${passed?esc(s.word.toUpperCase()):'ЗАКРИТО'}</span></p><button class="btn" id="nextLevel">${state.stage===stages.length-1?'Перейти до фінального речення':'Наступний рівень'}</button></div>`;$('#nextLevel').onclick=()=>{state.stage++;save();renderStage()};$('#finishLevel').classList.add('hidden');}
function finalTask(){const sentence=[{word:'мету',before:'Сформулюй '},{word:'дані',before:', збери '},{word:'чисті',before:', підготуй '},{word:'висновок',before:' дані, зроби '},{word:'перевір',before:', '},{word:'рішення',before:' його та ухвали обґрунтоване '}];let body='Сформулюй ';body+=sentence.map((x,i)=>{const got=!!state.clues[stages.findIndex(s=>s.word===x.word)];return ''}).join('');const parts=[['Сформулюй ','мету',', збери '],['', 'дані', ', підготуй '],['','чисті',' дані, зроби '],['','висновок',', '],['','перевір',' його та ухвали обґрунтоване '],['','рішення','.']];shell(topbar()+`<section class="card"><span class="tag">Фінальне завдання</span><h1 style="margin-top:14px">Склади алгоритм аналітика</h1><p class="muted">Слова, за які ти отримав ключі, уже відкриті. Для кожного пропущеного ключа введи правильне слово у відповідній формі. Коли речення буде правильним, місію завершено.</p><div class="mission-banner"><p style="font-size:1.12rem;line-height:2.4;margin:0">${parts.map((p,i)=>{const key=p[1],idx=stages.findIndex(s=>s.word===key),got=!!state.clues[idx];const input=got?`<b class="codeword">${esc(key)}</b>`:`<input aria-label="Введи слово ${key}" id="word${i}" value="${esc(state.finalInputs[i]||'')}" placeholder="?" style="display:inline-block;width:130px;max-width:40vw;padding:7px 9px;margin:0 4px">`;return `${p[0]}${input}${p[2]}`}).join('')}</p></div><div id="finalFeedback" class="hidden"></div><div class="actions"><button class="btn" id="checkFinal">Перевірити речення</button><button class="btn secondary" id="mapBtn">Карта квесту</button></div><div id="navMap" class="card hidden"><h3>Карта квесту</h3>${stageNav()}</div></section>`);parts.forEach((p,i)=>{const el=$('#word'+i);if(el)el.oninput=()=>{state.finalInputs[i]=el.value;save()}});$('#checkFinal').onclick=()=>{let ok=true;parts.forEach((p,i)=>{const idx=stages.findIndex(s=>s.word===p[1]);if(state.clues[idx])return;const el=$('#word'+i);const val=(el.value||'').trim().toLocaleLowerCase('uk-UA').replace(/[.,!?:;]/g,'');if(val!==p[1]){ok=false;el.style.borderColor='var(--red)'}else el.style.borderColor='var(--green)'});const f=$('#finalFeedback');f.classList.remove('hidden');if(ok){state.finished=true;save();f.className='feedback';f.innerHTML='<b>Речення складено правильно!</b> Ти завершив місію й продемонстрував повний шлях аналізу даних.<br><button class="btn" id="showReport">Показати звіт</button>';$('#showReport').onclick=report}else{f.className='feedback bad';f.textContent='Ще не все правильно. Перевір пропущені слова та їхню форму, а потім спробуй знову.'}};$('#mapBtn').onclick=()=>$('#navMap').classList.toggle('hidden')}
function report(){const earned=state.clues.filter(Boolean).length,total=state.scores.reduce((a,b)=>a+(b||0),0);shell(topbar()+`<section class="card"><span class="tag">Місію завершено</span><h1 style="margin-top:16px">Вітаємо, ${esc(state.name)}!</h1><p class="muted">Ти пройшов квест «Аналітик даних».</p><div class="result-score">${earned}<small> / 6 ключів</small></div><div class="mission-banner"><h2>Алгоритм аналітика</h2><p>Сформулюй <b>мету</b>, збери <b>дані</b>, підготуй <b>чисті</b> дані, зроби <b>висновок</b>, <b>перевір</b> його та ухвали обґрунтоване <b>рішення</b>.</p></div><p class="muted">Загалом правильних відповідей: ${total} із 30. Ключів отримано: ${earned} із 6. Використано підказок: ${state.hintUsed.length}.</p><h2>Звіт за рівнями</h2>${stages.map((s,i)=>`<div class="topic-row"><b>${s.name}</b><div class="muted">${state.scores[i]??0} з 5 (${(state.scores[i]??0)*20}%) · ${state.clues[i]?'Ключ отримано: '+esc(state.clues[i]):'Ключ не отримано'}</div><div class="bar"><i style="width:${(state.scores[i]??0)*20}%"></i></div></div>`).join('')}<div class="actions"><button class="btn" id="again">Пройти ще раз</button><button class="btn secondary" id="print">Друкувати / зберегти PDF</button></div></section>`);$('#again').onclick=()=>{localStorage.removeItem(KEY);state={name:'',cls:'',stage:0,answers:[],scores:[],clues:[],hintUsed:[],started:false,finished:false,finalInputs:{}};home()};$('#print').onclick=()=>window.print()}
home();

</script></body></html>
